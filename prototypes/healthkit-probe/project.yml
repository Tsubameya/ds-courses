# Projet Xcode généré par XcodeGen : `brew install xcodegen && xcodegen`
name: HealthProbe
options:
  bundleIdPrefix: app.directeursportif.prototype
  deploymentTarget:
    iOS: "17.0"
targets:
  HealthProbe:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Sonde Santé
        UILaunchScreen: {}
        NSHealthShareUsageDescription: "La sonde lit vos sorties vélo dans Santé pour vérifier quelles données les apps d'entraînement y écrivent."
        NSHealthUpdateUsageDescription: "La sonde n'écrit rien dans Santé."
    entitlements:
      path: Generated/HealthProbe.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # à renseigner, ou à choisir dans Xcode › Signing & Capabilities
